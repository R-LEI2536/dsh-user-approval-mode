# dsh-user-approval-mode bundle: approval modes
- insert:
    - id: dsh-user-approval-mode
      name: dsh-user-approval-mode
      config:
        default: off
        editTools: ['write', 'edit', 'str_replace_editor']
        shellTools: ['bash', 'pwsh', 'tool:bash', 'tool:pwsh']
        readOnlyTools: ['read', 'glob', 'grep', 'read_image', 'list_directory', 'todo_write']
        autoAllowTools: ['ask_user_question', 'exit_plan_mode']
        unclassified: ask
        sandboxDefaults:
          request: workspace-write
          auto-edit: workspace-write
          yolo: workspace-write
        # askReason: 审批弹窗里那段理由文字。部署方可在自己的 cordis.yml 中
        # 覆盖为本族语言或自定义文本。
        # 占位符：{tool} 工具名 / {mode} 当前模式 / {family} 工具族（edit|shell|readonly|other）
        askReason: 'approval needed for {tool} under {mode} mode ({family}); read-only browsing should use read/glob/list_directory instead of shell'
